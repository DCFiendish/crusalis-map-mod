plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = "Xaeros Fairplay Nation Overlay"
}

repositories {
	maven { url "https://maven.fabricmc.net/" }
	maven { url "https://api.modrinth.com/maven" }
	maven { url "https://chocolateminecraft.com/maven" }
}


loom {
	splitEnvironmentSourceSets()

	runs {
		client {
			vmArgs "-Dcrusalis.hookSpike=true"
			if (project.hasProperty("hookSpikeAutotest")) {
				vmArgs "-Dcrusalis.hookSpike.autotest=true"
				programArgs "--quickPlaySingleplayer", "HookSpike"
			}
		}
	}

	mods {
		"aechronis-map-mod" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Compile against 2.30.10 (Loom 1.16 refuses 2.36.x jars); dev runtime takes run/mods/XaeroPlus-*.jar.
	modCompileOnly "maven.modrinth:xaeroplus:2.30.10+fabric-1.21.11"
	modCompileOnly "xaero.map:xaeroworldmap-fabric-1.21.11:1.46.0"
	modCompileOnly "xaero.minimap:xaerominimap-fabric-1.21.11:26.5.0"
	// Hook spike: run the real maps in `gradlew runClient` (see docs/xaero-hooks.md).
	modLocalRuntime "xaero.map:xaeroworldmap-fabric-1.21.11:1.46.0"
	modLocalRuntime "xaero.minimap:xaerominimap-fabric-1.21.11:26.5.0"
	modCompileOnly files("libs/xaerolib-1.1.0-ab30ae2ca666ba3a.jar")
	modCompileOnly files("libs/xaerolib-1.1.15-8d2180f17290a347.jar")
	modImplementation "maven.modrinth:cloth-config:19.0.147+fabric"
	modCompileOnly "maven.modrinth:modmenu:15.0.0" // 15.x crashes the 1.21.11 dev client
}

processResources {
	inputs.property "version", project.version
	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	inputs.property "projectName", project.name
	from("LICENSE") {
		rename { "${it}_${project.name}" }
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}
}